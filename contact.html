<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Fieldnotes Studio</title>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>
<body>
<header class="site"><div class="bar">
<a class="brand" href="index.html">Fieldnotes</a>
<nav id="menu" aria-label="Main"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" class="active" aria-current="page">Contact</a></nav>
<button id="theme" aria-label="Switch light or dark mode"></button>
<button id="burger" aria-label="Menu" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
</div></header>
<main>
<section class="page"><h1>Contact us</h1>
<p>Tell us about your project and we will reply within two working days.</p>
<form id="form" novalidate>
<label for="name">Name</label><input id="name" name="name" autocomplete="name"><span class="err" role="alert"></span>
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><span class="err" role="alert"></span>
<label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea><span class="err" role="alert"></span>
<button class="cta" type="submit">Send message</button>
<p id="ok" class="ok" hidden>Thank you! Your message has been sent. We will be in touch soon.</p>
</form></section>
</main>
<footer class="site"><p>© 2026 Fieldnotes Studio. Made with care.</p></footer>
</body>
</html>
